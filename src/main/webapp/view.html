<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Geometry</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="map.css">
</head>
<body>
  <p><a href="/">Overview</a> &gt; View Geometry</p>

  <dl>
    <dt>Location</dt>
    <dd>
      <select id="loc-view">
        <option value="">&#x2014; select &#x2014;</option>
      </select>
      <button type="button"
              onclick="var v=document.getElementById('loc-view').value; if(v) setMapLocation('map-view',v)">Go</button>
    </dd>
    <dd>
      <input type="text" id="bbox-input-view"
             style="font-family:monospace;width:22em"
             placeholder="W,S,E,N"
             onkeydown="if(event.key==='Enter') setMapLocation('map-view',this.value)">
      <button type="button"
              onclick="setMapLocation('map-view',document.getElementById('bbox-input-view').value)">Go</button>
      <span id="bbox-zoom-view"></span>
    </dd>
  </dl>
  <div class="osm-map-cols">
    <div><div id="map-view" class="map"></div></div>
    <div id="feature-panel-view" class="feature-panel"></div>
  </div>
  <p id="links-view" class="map-controls"></p>
  <p id="status-view" class="map-controls"></p>

  <div id="form-view" style="display:none">
    <h2>View Geometry</h2>
    <form action="view.html">
      <label>URI: <input type="text" name="uri" size="60" value="/geo/osm/way/100.json"></label>
      <input type="submit" value="View">
    </form>
    <p>Examples:
      <a href="view.html?uri=%2Fgeo%2Fosm%2Fway%2F100.json">/geo/osm/way/100.json</a>,
      <a href="view.html?uri=%2Fgeo%2Fosm%2Frelation%2F71525.json">/geo/osm/relation/71525.json</a>
    </p>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="map-common.js"></script>
  <script src="map.js"></script>
  <script>
    fetch('examples.json').then(r => r.json()).then(ex => {
      var loc = document.getElementById('loc-view');
      ex.map.forEach(function(m) {
        var o = document.createElement('option');
        o.value = m.bbox; o.textContent = m.label; loc.appendChild(o);
      });
    });

    initOsmMap('map-view', 0, 0, 2);

    var params = new URLSearchParams(window.location.search);
    var uri = params.get('uri');

    if (!uri) {
        document.getElementById('form-view').style.display = '';
        document.getElementById('status-view').textContent = 'Enter a URI below to view geometry.';
    } else {
        // Build links
        var linksEl = document.getElementById('links-view');
        var geoMatch = uri.match(/\/geo\/(osm|overpass)\/(node|way|relation)\/(\d+)/);
        var featureUrl = geoMatch ? '/' + geoMatch[2] + '/' + geoMatch[3] : null;
        var links = featureUrl
            ? '<a href="' + escHtml(featureUrl) + '">' + escHtml(featureUrl) + '</a>'
            : 'GeoJSON: <a href="' + escHtml(uri) + '">' + escHtml(uri) + '</a>';
        if (geoMatch) {
            var source = geoMatch[1];
            var osmType = geoMatch[2];
            var osmId = geoMatch[3];
            var other = source === 'osm' ? 'overpass' : 'osm';
            links += ' | <a href="/geo/' + other + '/' + osmType + '/' + osmId + '.json">geo/' + other + '</a>';
            links += ' | <a href="https://www.openstreetmap.org/' + osmType + '/' + osmId + '" target="_blank">osm.org</a>';
        }
        linksEl.innerHTML = links;

        // Draw bbox rectangle if present in uri
        var bboxMatch = uri.match(/[?&]bbox=([^&]+)/);
        if (bboxMatch) {
            var parts = decodeURIComponent(bboxMatch[1]).split(',');
            if (parts.length === 4) {
                var west = parseFloat(parts[0]), south = parseFloat(parts[1]);
                var east = parseFloat(parts[2]), north = parseFloat(parts[3]);
                var state = window.maps['map-view'];
                L.rectangle([[south, west], [north, east]], {
                    color: '#666', weight: 2, dashArray: '6 4',
                    fill: false, interactive: false
                }).addTo(state.map);
            }
        }

        loadGeoJsonUrl('map-view', uri);
    }
  </script>
</body>
</html>
